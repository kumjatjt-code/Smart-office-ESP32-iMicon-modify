<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Office Controller</title>
  <!-- Google Fonts: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Prompt', 'sans-serif'],
          },
          colors: {
            brand: {
              dark: '#0b1120',
              card: 'rgba(30, 41, 59, 0.7)',
              border: 'rgba(255, 255, 255, 0.08)',
              active: '#0284c7',
              success: '#10b981',
              danger: '#f43f5e'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0b1120 75%);
      min-height: 100vh;
      color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
    }
    .glow-cyan {
      box-shadow: 0 0 25px rgba(14, 165, 233, 0.25);
    }
    .toggle-checkbox:checked {
      right: 0;
      border-color: #38bdf8;
    }
    .toggle-checkbox:checked + .toggle-label {
      background-color: #0284c7;
    }
    .toggle-checkbox {
      right: 22px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="font-sans antialiased flex justify-center p-3 sm:p-6 selection:bg-sky-500 selection:text-white">

  <div class="w-full max-w-md flex flex-col gap-4 pb-12">
    
    <!-- ส่วนหัว (Header) -->
    <header class="glass-card rounded-2xl p-4 flex items-center justify-between border-t border-white/15">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-sky-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-sky-500/20">
          <i class="fa-solid fa-building text-white text-lg"></i>
        </div>
        <div>
          <h1 class="text-base font-bold tracking-tight text-white flex items-center gap-2">
            SMART OFFICE
          </h1>
          <p class="text-xs text-slate-400 font-light">CONTROLLER SYSTEM</p>
        </div>
      </div>
      
      <!-- ป้ายสถานะออนไลน์/ออฟไลน์ -->
      <div id="statusBadge" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-rose-500/10 text-rose-400 border border-rose-500/20">
        <span class="w-2 h-2 rounded-full bg-rose-400"></span>
        <span id="statusText">กำลังเชื่อมต่อ...</span>
      </div>
    </header>

    <!-- นาฬิกาและสรุปอุปกรณ์ -->
    <div class="grid grid-cols-2 gap-3">
      <div class="glass-card rounded-xl p-3 flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-sky-500/10 flex items-center justify-center text-sky-400 text-sm">
          <i class="fa-regular fa-clock"></i>
        </div>
        <div>
          <div class="text-[10px] text-slate-400">เวลาปัจจุบัน</div>
          <div id="liveClock" class="text-xs font-semibold text-slate-200">--:--:-- น.</div>
        </div>
      </div>
      <div class="glass-card rounded-xl p-3 flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-emerald-500/10 flex items-center justify-center text-emerald-400 text-sm">
          <i class="fa-solid fa-bolt"></i>
        </div>
        <div>
          <div class="text-[10px] text-slate-400">กำลังเปิดทำงาน</div>
          <div id="activeCount" class="text-xs font-semibold text-emerald-400">0 / 4 เครื่อง</div>
        </div>
      </div>
    </div>

    <!-- โหมดอัตโนมัติ -->
    <div class="glass-card rounded-2xl p-4 border-l-4 border-l-sky-500 relative overflow-hidden">
      <div class="flex items-start justify-between gap-3">
        <div class="flex gap-3">
          <div class="mt-0.5 w-9 h-9 rounded-xl bg-sky-500/10 border border-sky-500/20 flex items-center justify-center text-sky-400 shrink-0">
            <i class="fa-solid fa-calendar-check text-sm"></i>
          </div>
          <div>
            <h2 class="text-sm font-semibold text-white leading-tight">โหมดทำงานอัตโนมัติตามเวลา (Auto Schedule)</h2>
            <p class="text-xs text-slate-400 mt-1 leading-relaxed">
              เปิด-ปิด Air 1, Air 2, Air 3 อัตโนมัติ<br>
              <span class="text-sky-300 font-medium">ช่วงเวลา 08:00 - 16:00 น. (รีเซ็ต 07:50 น.)</span>
            </p>
          </div>
        </div>
        <div class="relative inline-block w-12 align-middle select-none mt-1">
          <input type="checkbox" id="scheduleToggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-2 border-slate-700 appearance-none cursor-pointer focus:outline-none"/>
          <label for="scheduleToggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-slate-700/80 cursor-pointer transition-colors duration-200"></label>
        </div>
      </div>
    </div>

    <!-- ปุ่มเปิด/ปิดทั้งหมด -->
    <div class="grid grid-cols-2 gap-3">
      <button onclick="controlAll(true)" class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl bg-gradient-to-r from-teal-500 to-emerald-600 hover:from-teal-400 hover:to-emerald-500 active:scale-[0.98] transition-all text-white font-medium text-xs shadow-lg shadow-emerald-900/30">
        <i class="fa-solid fa-power-off"></i>
        เปิดอุปกรณ์ทั้งหมด
      </button>
      <button onclick="controlAll(false)" class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 active:scale-[0.98] transition-all text-white font-medium text-xs shadow-lg shadow-rose-900/30">
        <i class="fa-solid fa-power-off"></i>
        ปิดอุปกรณ์ทั้งหมด
      </button>
    </div>

    <!-- รายการควบคุม Relay ทั้ง 4 ช่อง -->
    <div class="flex flex-col gap-3" id="relaysContainer">
      <!-- การ์ดอุปกรณ์จะถูกเรนเดอร์ผ่าน JS -->
    </div>

  </div>

  <script>
    const wsUrl = (window.location.protocol === 'https:' ? 'wss://' : 'ws://') + window.location.host + '/esp';
    let socket = null;
    let isWsConnected = false;

    // ข้อมูลอุปกรณ์และตัวคูณคำนวณพลังงาน
    const devices = [
      { 
        name: "Air Conditioner 1", 
        desc: "25,000 Btu. 1 เฟส อาคารรับสมัคร", 
        icon: "fa-snowflake", 
        trackTime: true, 
        multiplier: 2.0 
      },
      { 
        name: "Air Conditioner 2", 
        desc: "25,000 Btu. 1 เฟส อาคารรับสมัคร", 
        icon: "fa-snowflake", 
        trackTime: true, 
        multiplier: 2.0 
      },
      { 
        name: "Air Conditioner 3", 
        desc: "53,000 Btu. 3 เฟส อาคารรับสมัคร", 
        icon: "fa-snowflake", 
        trackTime: true, 
        multiplier: 4.5 
      },
      { 
        name: "Office Ventilation / Light", 
        desc: "ระบบระบายอากาศ & ปั๊มน้ำ", 
        icon: "fa-fan", 
        trackTime: false, 
        multiplier: 0.0 
      }
    ];

    // สถานะจริงของรีเลย์ที่ได้รับยืนยันจากบอร์ด ESP32
    let relayStates = [false, false, false, false];
    let deviceTotalSeconds = [0, 0, 0, 0];
    let lastTickTimestamp = Date.now();

    // -------------------------------------------------------------
    // ฟังก์ชันคำนวณรอบวัน โดยตัดรอบใหม่ที่เวลา 07:50 น.
    // -------------------------------------------------------------
    function getOperationalDayKey(now) {
      const d = new Date(now.getTime());
      const totalMinutes = d.getHours() * 60 + d.getMinutes();
      // หากเวลาก่อน 07:50 น. (470 นาที) จะนับเป็นรอบของเมื่อวาน
      if (totalMinutes < 470) {
        d.setDate(d.getDate() - 1);
      }
      return `smart_office_cycle_${d.getFullYear()}_${d.getMonth() + 1}_${d.getDate()}`;
    }

    // ตรวจสอบและรีเซ็ตค่าเป็น 0 อัตโนมัติเมื่อถึง 07:50 น.
    function checkAndResetDailyCycle(now) {
      const currentKey = getOperationalDayKey(now);
      const savedKey = localStorage.getItem('smart_office_active_cycle');

      if (savedKey !== currentKey) {
        // ถึงเวลา 07:50 น. ของวันใหม่ -> รีเซ็ตเวลาและพลังงานเป็น 0 ทันที
        deviceTotalSeconds = [0, 0, 0, 0];
        localStorage.setItem('smart_office_active_cycle', currentKey);
        localStorage.setItem('smart_office_seconds', JSON.stringify(deviceTotalSeconds));
        renderCards();
      } else {
        const savedData = localStorage.getItem('smart_office_seconds');
        if (savedData) {
          try {
            deviceTotalSeconds = JSON.parse(savedData);
          } catch(e) {
            deviceTotalSeconds = [0, 0, 0, 0];
          }
        }
      }
    }

    // บันทึกค่าวินาทีสะสมลง LocalStorage
    function saveTotalSeconds() {
      localStorage.setItem('smart_office_seconds', JSON.stringify(deviceTotalSeconds));
    }

    // -------------------------------------------------------------
    // ฟังก์ชันคำนวณเฉพาะช่วงเวลาทำงาน (08:00 - 16:00 น.)
    // -------------------------------------------------------------
    function getWorkingSecondsBetween(startMs, endMs) {
      if (startMs >= endMs) return 0;
      const startDate = new Date(startMs);
      const endDate = new Date(endMs);

      // วินาทีนับจากเที่ยงคืนของเวลาเริ่มต้นและสิ้นสุด
      const startSec = startDate.getHours() * 3600 + startDate.getMinutes() * 60 + startDate.getSeconds() + startDate.getMilliseconds() / 1000;
      const endSec = endDate.getHours() * 3600 + endDate.getMinutes() * 60 + endDate.getSeconds() + endDate.getMilliseconds() / 1000;

      // ขอบเขตช่วงเวลา 08:00:00 (28,800 วิ) ถึง 16:00:00 (57,600 วิ)
      const windowStart = 8 * 3600;
      const windowEnd = 16 * 3600;

      // หาจุดตัดที่อยู่ในช่วงเวลา 08:00 - 16:00 เท่านั้น
      const overlapStart = Math.max(startSec, windowStart);
      const overlapEnd = Math.min(endSec, windowEnd);

      // หลัง 16:00 หรือก่อน 08:00 จะคืนค่า 0 (ไม่นับเวลาและพลังงานเพิ่ม)
      return overlapEnd > overlapStart ? (overlapEnd - overlapStart) : 0;
    }

    // คำนวณรูปแบบเวลาและพลังงานสะสม
    function getDeviceStats(idx) {
      const totalSecs = Math.floor(deviceTotalSeconds[idx] || 0);
      const h = String(Math.floor(totalSecs / 3600)).padStart(2, '0');
      const m = String(Math.floor((totalSecs % 3600) / 60)).padStart(2, '0');
      const s = String(Math.floor(totalSecs % 60)).padStart(2, '0');

      const timeFormatted = `${h} : ${m} : ${s}`;
      const fractionalHours = totalSecs / 3600;
      const energy = (fractionalHours * devices[idx].multiplier).toFixed(4);

      return { timeFormatted, energy };
    }

    // อัปเดตตัวเลขแสดงผลบนหน้าจอ
    function updateLiveStatsUI() {
      for (let i = 0; i < 4; i++) {
        if (devices[i].trackTime) {
          const stats = getDeviceStats(i);
          const timeEl = document.getElementById(`time_${i}`);
          const energyEl = document.getElementById(`energy_${i}`);
          if (timeEl && energyEl) {
            timeEl.textContent = stats.timeFormatted;
            energyEl.textContent = stats.energy;
          }
        }
      }
    }

    // -------------------------------------------------------------
    // ลูปหลักทำงานทุก 1 วินาที (Heartbeat Ticker)
    // -------------------------------------------------------------
    function mainTicker() {
      const now = new Date();
      const nowMs = now.getTime();

      // ตรวจสอบการรีเซ็ต 07:50 น.
      checkAndResetDailyCycle(now);

      // คำนวณวินาทีที่ผ่านไปเฉพาะในช่วง 08:00 - 16:00 น.
      const workingSec = getWorkingSecondsBetween(lastTickTimestamp, nowMs);
      lastTickTimestamp = nowMs;

      // เริ่มคิดเวลาและพลังงานก็ต่อเมื่อ:
      // 1. อยู่ในช่วง 08:00 - 16:00 น. (workingSec > 0)
      // 2. มีการเชื่อมต่อกับระบบจริง (isWsConnected)
      // 3. บอร์ด ESP32 ยืนยันว่ารีเลย์ต่อวงจรทำงานแล้วเท่านั้น (relayStates[i] === true)
      if (isWsConnected && workingSec > 0) {
        let hasChanged = false;
        for (let i = 0; i < 4; i++) {
          if (devices[i].trackTime && relayStates[i] === true) {
            deviceTotalSeconds[i] += workingSec;
            hasChanged = true;
          }
        }
        if (hasChanged) {
          saveTotalSeconds();
        }
      }

      // แสดงเวลาปัจจุบัน
      const timeStr = now.toLocaleTimeString('th-TH', { hour12: false });
      document.getElementById('liveClock').textContent = timeStr + ' น.';

      updateLiveStatsUI();
    }

    // เริ่มต้นตัวตรวจจับเวลา
    checkAndResetDailyCycle(new Date());
    setInterval(mainTicker, 1000);

    // -------------------------------------------------------------
    // การแสดงผลการ์ดอุปกรณ์ (UI Render)
    // -------------------------------------------------------------
    function renderCards() {
      const container = document.getElementById('relaysContainer');
      container.innerHTML = '';
      let activeCount = 0;

      devices.forEach((dev, idx) => {
        const isOn = relayStates[idx];
        if (isOn) activeCount++;
        
        const stats = getDeviceStats(idx);

        const card = document.createElement('div');
        card.className = `glass-card rounded-2xl p-4 transition-all duration-300 relative ${isOn ? 'border-sky-500/40 glow-cyan' : 'border-white/5 opacity-85'}`;
        
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3.5">
              <div class="w-12 h-12 rounded-xl flex items-center justify-center transition-all ${isOn ? 'bg-sky-500 text-white shadow-md shadow-sky-500/40' : 'bg-slate-800 text-slate-500'}">
                <i class="fa-solid ${dev.icon} text-lg"></i>
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <h3 class="text-sm font-semibold ${isOn ? 'text-white' : 'text-slate-300'}">${dev.name}</h3>
                  <span class="text-[10px] px-2 py-0.5 rounded-md font-bold uppercase tracking-wider ${isOn ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-slate-800 text-slate-500'}">
                    ${isOn ? 'RUNNING' : 'OFF'}
                  </span>
                </div>
                <p class="text-xs text-slate-400 mt-0.5">${dev.desc}</p>
              </div>
            </div>

            <div class="relative inline-block w-12 align-middle select-none">
              <input type="checkbox" id="switch_${idx}" ${isOn ? 'checked' : ''} onchange="toggleRelay(${idx}, this.checked)" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-2 border-slate-700 appearance-none cursor-pointer focus:outline-none"/>
              <label for="switch_${idx}" class="toggle-label block overflow-hidden h-6 rounded-full bg-slate-700 cursor-pointer transition-colors duration-200"></label>
            </div>
          </div>
          
          ${dev.trackTime ? `
            <div class="mt-4 pt-3 border-t border-white/10 grid grid-cols-2 gap-3 text-center">
              <div class="bg-slate-800/40 rounded-lg p-2.5 border border-slate-700/50">
                <div class="text-[10px] text-slate-400 mb-1">ชั่วโมง : นาที : วินาที (HH : MM : SS)</div>
                <div class="text-xs font-semibold text-sky-400 font-mono tracking-wide">
                  <span id="time_${idx}">${stats.timeFormatted}</span>
                </div>
              </div>
              <div class="bg-slate-800/40 rounded-lg p-2.5 border border-slate-700/50">
                <div class="text-[10px] text-slate-400 mb-1">พลังงานใช้ไป</div>
                <div class="text-xs font-semibold text-emerald-400 font-mono tracking-wide">
                  <span id="energy_${idx}">${stats.energy}</span> หน่วย
                </div>
              </div>
            </div>
          ` : ''}
        `;
        container.appendChild(card);
      });

      document.getElementById('activeCount').textContent = `${activeCount} / ${devices.length} เครื่อง`;
    }

    // -------------------------------------------------------------
    // ระบบเชื่อมต่อ WebSocket
    // -------------------------------------------------------------
    function initWebSocket() {
      try {
        socket = new WebSocket(wsUrl);

        socket.onopen = () => {
          isWsConnected = true;
          updateBadge(true);
          // ขอสถานะล่าสุดจาก Server
          socket.send(JSON.stringify({ type: "GET_STATE" }));
        };

        socket.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);

            if (typeof data.autoMode === 'boolean') {
              document.getElementById('scheduleToggle').checked = data.autoMode;
            }

            // รับสถานะรีเลย์จริงจาก ESP32 / Server เพื่อสั่งเรนเดอร์และนับเวลา
            if (data.relays && Array.isArray(data.relays)) {
              relayStates = data.relays;
              renderCards();
            } else if (data.type === "CONTROL" && typeof data.ch === 'number') {
              relayStates[data.ch] = data.state;
              renderCards();
            }
          } catch (e) {
            console.error("JSON Parse Error", e);
          }
        };

        socket.onclose = () => {
          isWsConnected = false;
          updateBadge(false);
          setTimeout(initWebSocket, 3000);
        };

        socket.onerror = () => {
          isWsConnected = false;
          socket.close();
        };
      } catch (err) {
        isWsConnected = false;
        updateBadge(false);
        setTimeout(initWebSocket, 3000);
      }
    }

    function updateBadge(connected) {
      const badge = document.getElementById('statusBadge');
      const text = document.getElementById('statusText');
      if (connected) {
        badge.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
        badge.firstElementChild.className = "w-2 h-2 rounded-full bg-emerald-400 animate-pulse";
        text.textContent = "ออนไลน์";
      } else {
        badge.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-rose-500/10 text-rose-400 border border-rose-500/20";
        badge.firstElementChild.className = "w-2 h-2 rounded-full bg-rose-400";
        text.textContent = "ขาดการเชื่อมต่อ";
      }
    }

    // -------------------------------------------------------------
    // ฟังก์ชันสั่งการ (ส่งคำสั่งไปยัง ESP32 ไม่นับเวลาก่อนได้รับการยืนยัน)
    // -------------------------------------------------------------
    function toggleRelay(ch, state) {
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ type: "CONTROL", ch: ch, state: state }));
      } else {
        // หากออฟไลน์อยู่ ให้ดึงสวิตช์กลับค่าเดิม
        renderCards();
      }
    }

    function controlAll(state) {
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ type: "CONTROL_ALL", state: state }));
      }
    }

    document.getElementById('scheduleToggle').addEventListener('change', function() {
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ type: "TOGGLE_AUTO", state: this.checked }));
      }
    });

    renderCards();
    initWebSocket();
  </script>
</body>
</html>
